name: Refresh player data

# Rebuilds data.json (ranks, projections, game logs, depth charts, and baked-in
# player news) and the offline standalone file, then commits any changes. This
# replaces the manual local refresh loop.

on:
  schedule:
    - cron: "17 9 * * *"        # daily, 09:17 UTC
  workflow_dispatch: {}          # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Fetch ranks, projections and news
        run: python3 fetch_espn.py

      - name: Fetch weekly game logs
        run: python3 fetch_gamelogs.py
        continue-on-error: true

      - name: Fetch depth charts and coaches
        run: python3 fetch_depth.py
        continue-on-error: true

      - name: Rebuild the offline standalone
        run: python3 build_standalone.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json ff-sidekick-standalone.html
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh player data ($(date -u +%Y-%m-%d))"
            git push
          fi
